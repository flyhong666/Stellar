pluginManagement {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }

    plugins {
        id("com.android.application") version '8.13.2'
        id("com.android.library") version '8.13.2'
        id("org.jetbrains.kotlin.android") version '2.3.21'
        id("org.jetbrains.kotlin.plugin.compose") version "2.3.21"
        id("com.google.devtools.ksp") version "2.3.12"
        id("dev.rikka.tools.autoresconfig") version "1.2.2"
        id("dev.rikka.tools.materialthemebuilder") version "1.5.1"
        id("dev.rikka.tools.refine") version "4.4.0"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven {
            url("https://jitpack.io")
            content {
                includeGroup("com.github.topjohnwu.libsu")
                includeGroup("com.github.Kyant0")
                includeGroup("com.github.jeziellago")
            }
        }
    }

    versionCatalogs {
        serverLibs {
            from(files('server/server.versions.toml'))
        }

        apiLibs {
            from(files('api/api.versions.toml'))
        }

        managerLibs {
            from(files('manager/manager.versions.toml'))
        }

        demoLibs {
            from(files('api/demo/demo.versions.toml'))
        }
    }
}

if (System.getenv("JITPACK") != "true") {
    include ':manager'
    include ':server'
}
def root = "api"

def propFile = file('local.properties')
def props = new Properties()

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    if (props != null) {
        if (props["api.useLocal"].equals("true")) {
            root = props["api.dir"]
        }
    }
}
include ':aidl'
project(':aidl').projectDir = file("$root${File.separator}aidl")

include ':shared'
project(':shared').projectDir = file("$root${File.separator}shared")

include ':api'
project(':api').projectDir = file("$root${File.separator}api")

include ':provider'
project(':provider').projectDir = file("$root${File.separator}provider")

// hidden-api-stub 只存在于部分 API 源码里，目录缺失时 Gradle 9 会直接报错
def hiddenApiStubDir = file("$root${File.separator}hidden-api-stub")
if (hiddenApiStubDir.isDirectory()) {
    include ':hidden-api-stub'
    project(':hidden-api-stub').projectDir = hiddenApiStubDir
}

include ':userservice'
project(':userservice').projectDir = file("$root${File.separator}userservice")

include ':shizuku-aidl'
project(':shizuku-aidl').projectDir = file('shizuku/aidl')

include ':shizuku-api'
project(':shizuku-api').projectDir = file('shizuku/api')

include ':demo'
project(':demo').projectDir = file("$root${File.separator}demo")
